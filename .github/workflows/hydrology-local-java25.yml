name: Export Java 25 for native hydrology diagnostics
on:
  push:
    branches: [audit/natural-hydrology-transfer]
    paths: [.github/workflows/hydrology-local-java25.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Export the unmodified toolchain with version and digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir java25-export
          "$JAVA_HOME/bin/java" -version 2>java25-export/version.txt
          tar -C "$JAVA_HOME" -czf java25-export/java25-linux-x64.tar.gz .
          (cd java25-export && sha256sum java25-linux-x64.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hydrology-java25-linux-x64
          path: java25-export/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

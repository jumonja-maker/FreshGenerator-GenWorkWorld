name: Recover current hydrology observations
on:
  push:
    branches: [audit/hydrology-evidence-resume]
    paths: [.github/workflows/hydrology-current-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recover run-bound raw evidence and concise diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,pathlib,re,urllib.request
          run=43316322914; source='3a9ad243c76cae7e1e6c4bb444b3344639f68878'
          root=pathlib.Path('evidence');root.mkdir()
          class SignedRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                      redirected.remove_header('Accept')
                  return redirected
          opener=urllib.request.build_opener(SignedRedirect())
          def get(path,binary=False):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with opener.open(req,timeout=90) as response: raw=response.read()
              return raw if binary else json.loads(raw)
          jobs=get('/actions/runs/'+str(run)+'/jobs?per_page=100')['jobs']
          (root/'jobs.json').write_text(json.dumps(jobs))
          for job in jobs:
              if job['status']!='completed' or job['conclusion']=='skipped': continue
              if not (job['name'].startswith(('Native hydrology','worlds'))): continue
              log=get('/actions/jobs/'+str(job['id'])+'/logs',True).decode('utf-8-sig')
              (root/(str(job['id'])+'.log')).write_text(log)
              print('JOB',job['name'],job['conclusion'])
              for line in log.splitlines():
                  if 'ValueError:' in line or 'AssertionError:' in line: print(line)
              matches=re.findall(r'CI_EVIDENCE_STORED (\{[^\n]+\})',log)
              if not matches: continue
              item=json.loads(matches[-1]);blob=get('/git/blobs/'+item['blob'])
              raw=base64.b64decode(blob['content'])
              assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==item['blob']
              bundle=json.loads(gzip.decompress(raw));assert bundle['identity']['GITHUB_SHA']==source
              folder=root/item['name'];folder.mkdir()
              docs={}
              for name,entry in bundle['files'].items():
                  assert '..' not in pathlib.PurePosixPath(name).parts and not name.startswith('/')
                  data=base64.b64decode(entry['content']);assert hashlib.sha256(data).hexdigest()==entry['sha256']
                  target=folder/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
                  if name.endswith('.json'): docs[name]=json.loads(data)
              if 'normal-candidate.json' not in docs: continue
              controls=[docs[m+'.json'] for m in ['normal-baseline','normal-repeat-1','normal-repeat-2']]
              candidate=docs['normal-candidate.json'];unknown=[];variable=0
              for wi,w in enumerate(candidate['windows']):
                  originals=[d['windows'][wi] for d in controls]
                  for i,p in enumerate(w['fullBlockStates']):
                      values={v['blockPalette'][v['fullBlockStates'][i]] for v in originals}
                      state=w['blockPalette'][p];variable+=len(values)>1
                      if state not in values:
                          c=i//384;y=i%384-64
                          unknown.append({'kind':w['site']['kind'],'x':w['site']['x']+c%33-16,'z':w['site']['z']+c//33-16,'y':y,'before':sorted(values),'after':state})
              print('NORMAL_DIFF',item['name'],'variable',variable,'unknown',len(unknown),json.dumps(unknown[:20]))
              (folder/'normal-differences.json').write_text(json.dumps({'variable':variable,'unknown':unknown},indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-hydrology-observations
          path: evidence/
          retention-days: 7
          if-no-files-found: error

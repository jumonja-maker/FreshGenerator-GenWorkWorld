name: Prepare verified water-supported ice audit
on:
  push:
    branches: [fix/lake-river-generation-v2]
    paths: [.github/workflows/hydrology-prepare-ice-audit.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-ice-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify exact audit-only changes and prepare an unreferenced commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          assert os.environ['GITHUB_REPOSITORY']=='jumonja-maker/FreshGenerator-GenWorkWorld'
          assert os.environ['GITHUB_REF']=='refs/heads/fix/lake-river-generation-v2'
          assert git('rev-parse','HEAD^')=='ee84c5c80561a2671ec8caf9e062102f114026b8'
          p=Path('src/audit/java/dev/freshgenerator/audit/VoxelConnectivity.java')
          s=p.read_text().replace(' * Bottom-connected components', ' * Optional evidence: bit 3 = ordinary ice, bit 4 = source water, bit 5 = sturdy dry floor.\n * Fluids never connect or ground terrain components.\n * Bottom-connected components')
          s=s.replace('    private VoxelConnectivity() { }','''    public static final int ORDINARY_ICE = 8, SOURCE_WATER = 16, STURDY_FLOOR = 32;
              private VoxelConnectivity() { }

              /** An ice sheet floats on water, not on air. This is separate from the
               * six-connected terrain scan: stone above water must still be reported.
               * Fail closed unless every occupied cell of this exact component is ordinary
               * ice, with an uninterrupted source-water column ending on a sturdy dry bed.
               * Scanning a bounding box is conservative: any other occupied component
               * inside it causes the exact occupied-count check to reject the exemption. */
              public static boolean waterSupportedIce(byte[] cells, int width, int height, int depth, Component component) {
                  Objects.requireNonNull(cells); Objects.requireNonNull(component);
                  if (width < 1 || height < 1 || depth < 1 || (long)width*height*depth != cells.length
                          || component.blocks() < 1 || component.minX() < 0 || component.maxX() >= width
                          || component.minY() < 1 || component.maxY() >= height
                          || component.minZ() < 0 || component.maxZ() >= depth)
                      return false;
                  int plane=width*depth, count=0;
                  for(int y=component.minY();y<=component.maxY();y++)
                      for(int z=component.minZ();z<=component.maxZ();z++)
                          for(int x=component.minX();x<=component.maxX();x++) {
                              int i=y*plane+z*width+x, flags=cells[i];
                              if((flags&1)==0)continue;
                              if((flags&ORDINARY_ICE)==0 || sourceWaterDepthBelow(cells,i,plane)==0)return false;
                              count++;
                          }
                  return count==component.blocks();
              }

              /** Zero means missing, interrupted, boundary-unknown or unsupported water. */
              public static int sourceWaterDepthBelow(byte[] cells,int index,int plane) {
                  if(plane<=0 || index<plane || index>=cells.length)return 0;
                  int at=index-plane, water=0;
                  while(at>=0 && (cells[at]&SOURCE_WATER)!=0 && (cells[at]&1)==0) {water++;at-=plane;}
                  return water>0 && at>=0 && (cells[at]&(1|STURDY_FLOOR))==(1|STURDY_FLOOR)
                          && (cells[at]&(SOURCE_WATER|ORDINARY_ICE))==0 ? water : 0;
              }''')
          p.write_text(s)
          p=Path('src/audit/java/dev/freshgenerator/audit/TechnicalWorldAudit.java');s=p.read_text()
          s=s.replace('import net.minecraft.world.level.block.state.BlockState;','import net.minecraft.world.level.block.state.BlockState;\nimport net.minecraft.world.level.block.Blocks;')
          s=s.replace('        if(b.isAir()||(!b.isSolid()&&!b.getFluidState().isEmpty()))return (byte)0;','''        if(b.is(Blocks.WATER)&&b.getFluidState().isSource())return (byte)VoxelConnectivity.SOURCE_WATER;
                  if(b.isAir()||(!b.isSolid()&&!b.getFluidState().isEmpty()))return (byte)0;''')
          s=s.replace('return (byte)(nativeBlock&&(NATURAL.contains(path)||path.endsWith("_ore")||path.endsWith("_terracotta"))?3:1);','''int flags=nativeBlock&&(NATURAL.contains(path)||path.endsWith("_ore")||path.endsWith("_terracotta"))?3:1;
                  if(b.is(Blocks.ICE))flags|=VoxelConnectivity.ORDINARY_ICE;
                  return (byte)flags;''')
          s=s.replace('pos.set(wx,minY+y,wz);byte kind=classify(chunk.getBlockState(pos));','''pos.set(wx,minY+y,wz);var block=chunk.getBlockState(pos);byte kind=classify(block);
                          if((kind&1)!=0 && block.getFluidState().isEmpty() && block.isFaceSturdy(level,pos,Direction.UP))
                              kind|=VoxelConnectivity.STURDY_FLOOR;''')
          s=s.replace('JsonArray candidates=new JsonArray();int sky=0,belowSea=0,protectedCount=0,cave=0,singletons=0;long naturalBlocks=0;','''JsonArray candidates=new JsonArray(),floatingIce=new JsonArray();
                  int sky=0,belowSea=0,protectedCount=0,cave=0,singletons=0;long naturalBlocks=0;''')
          s=s.replace('            sky++;naturalBlocks+=c.naturalBlocks();if(c.blocks()==1)singletons++;','''            if(VoxelConnectivity.waterSupportedIce(cells,width,height,depth,c)) {
                          JsonObject ice=new JsonObject();ice.addProperty("component_blocks",c.blocks());
                          JsonArray columns=new JsonArray();
                          for(int y=c.minY();y<=c.maxY();y++)for(int z=c.minZ();z<=c.maxZ();z++)for(int x=c.minX();x<=c.maxX();x++) {
                              int i=y*width*depth+z*width+x;
                              if((cells[i]&1)==0)continue;
                              int waterDepth=VoxelConnectivity.sourceWaterDepthBelow(cells,i,width*depth);
                              columns.add(GSON.toJsonTree(List.of(minCX*16+x,minCZ*16+z,minY+y,minY+y-waterDepth-1)));
                          }
                          ice.add("source_water_columns_x_z_ice_y_bed_y",columns);floatingIce.add(ice);continue;
                      }
                      sky++;naturalBlocks+=c.naturalBlocks();if(c.blocks()==1)singletons++;''')
          s=s.replace('        r.addProperty("isolated_single_blocks",singletons);','''        r.addProperty("water_supported_ice_components",floatingIce.size());
                  r.add("water_supported_ice_evidence",floatingIce);
                  r.addProperty("isolated_single_blocks",singletons);''')
          p.write_text(s)
          p=Path('scripts/summarize_technical_audit.py');s=p.read_text().replace("        'isolated_single_blocks':", "        'water_supported_ice_components':sum(x.get('water_supported_ice_components',0) for x in r['regions']),\n        'isolated_single_blocks':")
          s=s.replace('structure/cave/sea exclusions; boundary contact is unknown.', 'structure/cave/sea exclusions; ordinary ice is separately evidenced only over uninterrupted source water ending on a sturdy dry bed. Water never supports stone in the connectivity test; boundary contact is unknown.')
          p.write_text(s)
          p=Path('src/test/java/dev/freshgenerator/VoxelConnectivityTest.java');s=p.read_text();i=s.rfind('}')
          s=s[:i]+'''
              private static byte[] icedWater(){
                  byte[] a=new byte[150];a[at(2,0,2)]=(byte)(3|VoxelConnectivity.STURDY_FLOOR);
                  a[at(2,1,2)]=(byte)VoxelConnectivity.SOURCE_WATER;
                  a[at(2,2,2)]=(byte)VoxelConnectivity.SOURCE_WATER;
                  a[at(2,3,2)]=(byte)(3|VoxelConnectivity.ORDINARY_ICE);return a;
              }
              private static boolean buoyant(byte[] a){var c=scan(a).detached().getFirst();return VoxelConnectivity.waterSupportedIce(a,5,6,5,c);}
              @Test void sourceWaterSupportsOnlyAnObservedIceSheet(){var a=icedWater();assertTrue(buoyant(a));assertEquals(2,VoxelConnectivity.sourceWaterDepthBelow(a,at(2,3,2),25));assertEquals(1,scan(a).detached().size());}
              @Test void floatingStoneOverWaterStillFails(){var a=icedWater();a[at(2,3,2)]=3;assertFalse(buoyant(a));}
              @Test void iceOverAirStillFails(){var a=icedWater();a[at(2,2,2)]=0;assertFalse(buoyant(a));}
              @Test void interruptedWaterColumnStillFails(){var a=icedWater();a[at(2,1,2)]=0;assertFalse(buoyant(a));}
              @Test void unknownOrNonSturdyBedStillFails(){var a=icedWater();a[at(2,0,2)]=16;assertFalse(buoyant(a));a[at(2,0,2)]=1;assertFalse(buoyant(a));}
              @Test void iceMixedWithStoneStillFails(){var a=icedWater();a[at(3,3,2)]=3;assertFalse(buoyant(a));}
              @Test void eachIceBlockNeedsItsOwnWaterSupport(){var a=icedWater();a[at(3,3,2)]=11;assertFalse(buoyant(a));a[at(3,0,2)]=35;a[at(3,1,2)]=16;a[at(3,2,2)]=16;assertTrue(buoyant(a));}
              @Test void waterEvidenceDoesNotChangeTerrainConnectivityOrInput(){var a=icedWater();var copy=a.clone();assertTrue(buoyant(a));assertArrayEquals(copy,a);assertEquals(1,scan(a).groundedComponents());assertEquals(1,scan(a).detached().size());}
          '''+s[i:];p.write_text(s)
          expected={'scripts/summarize_technical_audit.py':'a6b69ec23683db0ac24c51c1206cf0a4c5503e90','src/audit/java/dev/freshgenerator/audit/TechnicalWorldAudit.java':'d86088c4e0c2cf9231a8b931cc412d4d8c5ff63d','src/audit/java/dev/freshgenerator/audit/VoxelConnectivity.java':'8d2314a5a133f227d7bceaae7fa5db30bd8ce2a6','src/test/java/dev/freshgenerator/VoxelConnectivityTest.java':'0de5cb8b0e77f41c29200466629aed4bbb0c3505'}
          assert set(git('diff','--name-only').splitlines())==set(expected)
          def post(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as res:return json.load(res)
          entries=[]
          for path,digest in expected.items():
              data=Path(path).read_bytes()
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==digest, path
              blob=post('/git/blobs',{'content':data.decode(),'encoding':'utf-8'});assert blob['sha']==digest
              entries.append({'path':path,'mode':'100644','type':'blob','sha':digest})
          entries.append({'path':'.github/workflows/hydrology-prepare-ice-audit.yml','mode':'100644','type':'blob','sha':None})
          tree=post('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          commit=post('/git/commits',{'message':'test: distinguish verified water-supported ice from floating terrain\n\nNative paired TERRAIN and FULL probes identified all seven rejected components as ordinary river ice, not rock. Preserve the zero-floating-terrain release gate and record each ice column with its measured water depth and sturdy bed. Water never connects stone in the terrain scan. Add eight adversarial tests for unsupported ice, stone over water, interrupted water and mixed components.\n\nNo production generation, JAR resources or thresholds changed. Local Java 25: 20 connectivity tests and 164 Python tests passed. Full CI remains mandatory.', 'tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          print('FRESHGENERATOR_PREPARED_ICE_COMMIT '+commit['sha'])

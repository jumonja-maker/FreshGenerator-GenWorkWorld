name: Prepare checksum-verified hydrology fixes
on:
  push:
    branches: [fix/lake-river-generation-v2]
    paths: [.github/workflows/hydrology-prepare-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-hydrology]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify patch inputs and prepare an unreferenced commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, re, subprocess, urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/fix/lake-river-generation-v2'
          assert os.environ['GITHUB_REPOSITORY']=='jumonja-maker/FreshGenerator-GenWorkWorld'
          def git(*args): return subprocess.check_output(['git',*args]).decode().strip()
          assert git('rev-parse','HEAD^')=='2753cc89a98478ea330f4cb1932e3db02bd56122'
          encoded=''
          # Correct three transcription-sensitive characters before checking the
          # complete compressed payload and all resulting Git blob identities.
          encoded=encoded.replace('Hck2e/oi+eADX','Hck2e/oi+ADX').replace('XSPUH4Yb','XSPUh4Yb').replace('B+cinM+Uguw','B+cinM+zguw')
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='39cd1819985844f89f5ac386ce3ad41c499066808b09f8d40dd7d6059095fc81'
          Path('/tmp/reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/reviewed.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/reviewed.patch'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          expected={}
          for part in patch.decode().split('diff --git ')[1:]:
              path=part.splitlines()[0].split(' b/',1)[1]
              assert path.startswith('src/') and '..' not in Path(path).parts
              expected[path]=re.search(r'^index [0-9a-f]{40}\.\.([0-9a-f]{40})',part,re.M).group(1)
          assert len(expected)==10
          assert set(git('diff','--cached','--name-only').splitlines())==set(expected)
          def post(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+endpoint,
                data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as res:return json.load(res)
          entries=[]
          for path,digest in expected.items():
              assert git('rev-parse',':'+path)==digest
              data=Path(path).read_bytes()
              assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==digest
              blob=post('/git/blobs',{'content':data.decode(),'encoding':'utf-8'})
              assert blob['sha']==digest
              entries.append({'path':path,'mode':'100644','type':'blob','sha':digest})
          entries.append({'path':'.github/workflows/hydrology-prepare-fix.yml','mode':'100644','type':'blob','sha':None})
          tree=post('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          commit=post('/git/commits',{'message':'fix: preserve native caves, surface materials and dry river banks\n\nConfine added highland roof protection to altered shallow terrain; retain native underwater passages beside sea-level channels. Preserve chunk-native non-river surface biomes and reject tree soil that raises dry stream banks. Record exact bank blocks and recognize walkable native decks over solid banks.\n\nLocally checked with Java 25: 257 JUnit tests, 160 Python tests, package scope, focused native blocks and paired FULL generation. Full five-seed CI remains mandatory before publication.', 'tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          print('FRESHGENERATOR_PREPARED_COMMIT '+commit['sha'])
          print(json.dumps(expected,indent=2))
          # No branch is advanced here. The caller checks this result and updates
          # the PR branch with an expected-head lease through its GitHub connector.

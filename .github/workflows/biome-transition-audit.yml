name: Audit biome and mountain transitions
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/biome-transition-audit.yml
      - scripts/biome_transition_audit.sh
      - src/audit/java/dev/freshgenerator/audit/BiomeTransitionAudit.java
permissions:
  contents: read
jobs:
  audit:
    name: Audit seed ${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 1337, -20261111]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-disabled: true
      - run: gradle --no-daemon --console=plain test
        if: matrix.seed == 42
      - run: bash scripts/biome_transition_audit.sh "$FG_SEED"
        env:
          FG_SEED: ${{ matrix.seed }}
      - name: Show raw audit JSON
        if: always()
        run: |
          shopt -s nullglob
          for report in build/reports/biome-transitions/run.*/seed-*.json; do
            printf '::group::%s\n' "$(basename "$report")"
            cat "$report"
            printf '%s\n' '::endgroup::'
          done

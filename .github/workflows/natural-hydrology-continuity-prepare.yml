name: Prepare verified floodplain continuity patch
on:
  push:
    branches: [audit/natural-hydrology-transfer]
    paths: [.github/workflows/natural-hydrology-continuity-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Verify reviewed source changes without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          parent='e0a303b329c70a2f6eed4c55e4ef24d47675957d'
          assert os.environ['GITHUB_REPOSITORY']=='jumonja-maker/FreshGenerator-GenWorkWorld'
          subprocess.run(['git','checkout','--detach',parent],check=True)
          patch=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest()=='5d07e1a0838bdda5d5716b8250b2df5e62594f0f22c95c6d3c5c82775519fe60'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          expected={
            'src/core/java/dev/freshgenerator/core/DrainageModel.java':'2b8d16b6fc38d6a09f6e4c1ca3b0d2fc523e8a75ba6453b2ec335505cdaf7093',
            'src/core/java/dev/freshgenerator/core/DrainageBasin.java':'d7ac014df44e3dfd4aeee8029ddf9208f367fcfadfecd4f278b45044e2fea703',
            'scripts/validate_hydrology_patch.py':'5591822468a4ff2e516fab47a9266020e1b36416bb244e2d2b346c71e95c6a37',
            'src/test/java/dev/freshgenerator/core/DrainageChannelContinuationTest.java':'d94d5727d639283e477b8bba9d4a513cbc00add94c2ec7aba61ccbc4f861f6e7'}
          for path,sha in expected.items(): assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,path
          subprocess.run(['git','diff','--check'],check=True)
          def post(endpoint,body):
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+endpoint,
                  data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          entries=[]
          for path in expected:
              blob=post('/git/blobs',{'content':Path(path).read_text(),'encoding':'utf-8'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('/git/trees',{'base_tree':'34e7fcba1bfc038477f384426a0ae4ba11f680f3','tree':entries})
          commit=post('/git/commits',{'message':'fix: preserve established channels across open floodplains\n\nUse valley confinement for channel initiation, then inherit a completed channel certificate through the same downstream graph. Iterative traversal has no arbitrary distance cutoff; the 304-block coherent exterior domain bounds eligible headwaters. Keep at most 4096 grids of 64 completed decisions in a separate bounded cache to avoid repeated negative traversals. Do not invent channels on a featureless slope or paint a last-link tributary just because its receiver is a river.\n\nAfter a certified lake saddle, prefer the existing downhill receiver chain when it reaches lower ground inside the verified spill window. This removes a reproduced equal-cost Priority-Flood detour without changing the spill threshold or discarding fallback routes.\n\n290 local real-API Java tests and 177 Python discovery tests pass, including six new regressions for floodplain continuity, long routes, no planar sheet rivers, deterministic ordering, the elevation domain and downhill spill paths. Full native CI and visual acceptance remain required; this is not a published release.', 'tree':tree['sha'],'parents':[parent]})
          print('FRESHGENERATOR_PREPARED_CONTINUITY_COMMIT',commit['sha'])
          print('VERIFIED_FILE_SHA256',json.dumps(expected,sort_keys=True))

name: Export exact morphology regression observations
on:
  push:
    branches: [audit/natural-hydrology-transfer]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify preserved native observations for the failed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, urllib.request
          from pathlib import Path
          blobs = {
            'hydrology-1337': '102e648aed56aa7a4748c097024482819a41fc38',
            'hydrology-801086821803359396': 'bca3ddb03b5b81c4d8ef2abe246c8419637acb69',
            'technical-build': '1bb1fb914362829609cd2039073e69d63167a63d'
          }
          root = Path('morphology-evidence'); root.mkdir()
          index = []
          for label, sha in blobs.items():
              url = 'https://api.github.com/repos/' + os.environ['REPO'] + '/git/blobs/' + sha
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  item = json.loads(response.read(20000000))
              raw = base64.b64decode(item['content'])
              assert hashlib.sha1(('blob ' + str(len(raw)) + '\0').encode() + raw).hexdigest() == sha
              bundle = json.loads(gzip.decompress(raw))
              assert bundle['identity']['GITHUB_SHA'] == '15a13eb53107f559240dc6fc4cf1b8db406fb5d7'
              assert bundle['identity']['GITHUB_RUN_ID'] == '43419121308'
              folder = root / label; folder.mkdir()
              (folder / 'identity.json').write_text(json.dumps(bundle['identity'], indent=2))
              for name, entry in bundle['files'].items():
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  data = base64.b64decode(entry['content'])
                  assert hashlib.sha256(data).hexdigest() == entry['sha256'], name
                  target = folder / path; target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              index.append({'name': label, 'blob': sha, 'files': len(bundle['files'])})
          (root / 'index.json').write_text(json.dumps(index, indent=2))
          print('VERIFIED_MORPHOLOGY_REGRESSION_EVIDENCE', json.dumps(index))
      - uses: actions/upload-artifact@v4
        with:
          name: morphology-regression-15a13eb
          path: morphology-evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 3

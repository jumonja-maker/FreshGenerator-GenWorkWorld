name: Validate ecological forest development
on:
  workflow_dispatch:
  push:
    paths: ['src/core/java/dev/freshgenerator/core/ForestEcology.java', 'src/main/java/dev/freshgenerator/forest/**', 'src/main/java/dev/freshgenerator/mixin/ForestPlacementMixin.java', 'src/test/java/dev/freshgenerator/Forest*', '.github/workflows/forest-build.yml']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - run: gradle --no-daemon --console=plain clean build
      - name: Print failed assertions
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          for p in pathlib.Path('build/test-results/test').glob('TEST-*.xml'):
            for c in E.parse(p).getroot().findall('testcase'):
              for f in c.findall('failure')+c.findall('error'): print(p.name,c.get('name'),f.get('message'),(f.text or '')[:4000])
          PY

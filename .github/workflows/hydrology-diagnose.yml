name: Diagnose preserved hydrology evidence
on:
  push:
    branches: [fix/lake-river-generation-v2]
    paths: [.github/workflows/hydrology-diagnose.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-hydrology]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Archive the exact source and verified raw observations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64, gzip, hashlib, json, os, re, subprocess, urllib.request, urllib.parse
          from pathlib import Path
          REPO=os.environ['REPO']; RUN=43328807182
          SHA='d952a8328b659cf00902b7c23b334bc4f404e3c3'
          root=Path('diagnosis'); root.mkdir()
          subprocess.run(['git','archive','--format=tar.gz','--output=diagnosis/source.tar.gz','HEAD'],check=True)
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  result=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if result and urllib.parse.urlsplit(req.full_url).netloc != urllib.parse.urlsplit(newurl).netloc:
                      result.remove_header('Authorization')
                  return result
          opener=urllib.request.build_opener(SafeRedirect())
          def get(path, binary=False):
              request=urllib.request.Request('https://api.github.com/repos/'+REPO+path,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with opener.open(request,timeout=90) as response: data=response.read(80000000)
              return data if binary else json.loads(data)
          jobs=get('/actions/runs/'+str(RUN)+'/jobs?per_page=100')['jobs']
          index=[]
          for job in jobs:
              if job['conclusion']!='failure': continue
              log=get('/actions/jobs/'+str(job['id'])+'/logs',True).decode('utf-8-sig')
              matches=re.findall(r'CI_EVIDENCE_STORED (\{[^\n]+\})',log)
              print(job['name'],[line for line in log.splitlines() if 'ValueError:' in line])
              if not matches: continue
              item=json.loads(matches[-1]); blob=get('/git/blobs/'+item['blob'])
              raw=base64.b64decode(blob['content'])
              assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==item['blob']
              bundle=json.loads(gzip.decompress(raw))
              assert bundle['identity']['GITHUB_SHA']==SHA and bundle['identity']['GITHUB_RUN_ID']==str(RUN)
              folder=root/str(job['id']); folder.mkdir()
              (folder/'job.log').write_text(log)
              (folder/'identity.json').write_text(json.dumps(bundle['identity'],indent=2))
              for name,entry in bundle['files'].items():
                  path=Path(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  data=base64.b64decode(entry['content'])
                  assert hashlib.sha256(data).hexdigest()==entry['sha256']
                  dest=folder/path; dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
              index.append({'job':job['name'],'id':job['id'],'blob':item['blob'],'files':list(bundle['files'])})
          (root/'index.json').write_text(json.dumps(index,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydrology-diagnosis-d952a83
          path: diagnosis/
          retention-days: 3
          compression-level: 9
          if-no-files-found: error

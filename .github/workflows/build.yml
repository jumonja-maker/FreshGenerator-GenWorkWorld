name: Build and validate FreshGenerator
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - name: Canonical Central fallback
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp scripts/central-fallback.init.gradle "$GRADLE_USER_HOME/init.d/freshgenerator-central-fallback.init.gradle"
      - name: Compile candidate and preserve existing generation contracts
        run: gradle --no-daemon --console=plain clean build
  villages:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: '42', evidence_key: world_fresh_42}
          - {seed: '1337', evidence_key: world_fresh_1337}
          - {seed: '-20261111', evidence_key: world_fresh_negative}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - name: Canonical Central fallback
        run: |
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp scripts/central-fallback.init.gradle "$GRADLE_USER_HOME/init.d/freshgenerator-central-fallback.init.gradle"
      - name: Actual baseline villages, candidate and reload
        run: bash scripts/village_audit.sh '${{ matrix.seed }}'
      - name: Preserve failures and actual observations
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_evidence.py put '${{ matrix.evidence_key }}' 'build/reports/villages/${{ matrix.seed }}' '*.json' '*.log'

name: Build and validate FreshGenerator
on:
  push:
    paths-ignore: ['dist/**', 'research/**', 'docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - name: Compile actual game and run all unit tests
        run: gradle --no-daemon --console=plain clean build
      - name: Paired forest seed 42 and save reload
        run: bash scripts/forest_world_audit.sh 42 fresh
      - name: Paired forest seed 1337 and save reload
        run: bash scripts/forest_world_audit.sh 1337 fresh
      - name: Paired forest seed -20261111 and save reload
        run: bash scripts/forest_world_audit.sh -20261111 fresh
      - name: Ordinary Minecraft scope control and save reload
        run: bash scripts/forest_world_audit.sh 42 normal
      - name: Recheck structures and terrain with vanilla controls
        run: bash scripts/terrain_fix_audit.sh
      - name: Preserve detailed failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          for p in pathlib.Path('build/test-results/test').glob('TEST-*.xml'):
            for c in E.parse(p).getroot().findall('testcase'):
              for f in c.findall('failure')+c.findall('error'): print(p.name,c.get('name'),f.get('message'))
          for p in pathlib.Path('build/reports/forest').rglob('*.json'):
            if p.name=='comparison.json': print(p,p.read_text())
          PY
      - name: Require completed evidence and validate distributable
        run: python3 scripts/validate_forest_release.py
      - name: Publish checked binary and attributable evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m 'build: publish tested ecological forest placement and evidence [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"

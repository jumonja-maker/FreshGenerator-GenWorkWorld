name: Build and validate FreshGenerator
on:
  push:
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-disabled: true
      - name: Compile native game and test deterministic transition model
        run: gradle --no-daemon --console=plain clean build
      - name: Controlled historical A-A-B and single world save-reload
        run: bash scripts/world_smoke.sh
      - name: Compare identical biome junctions before and after
        run: bash scripts/fixed_ecotone_audit.sh
      - name: Recheck mountains and structures against vanilla controls
        run: bash scripts/terrain_fix_audit.sh
      - name: Search biome junctions on corrected worlds
        run: bash scripts/biome_transition_audit.sh
      - name: Preserve detailed test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          for p in pathlib.Path('build/test-results/test').glob('TEST-*.xml'):
            for c in E.parse(p).getroot().findall('testcase'):
              for f in c.findall('failure')+c.findall('error'): print(p.name,c.get('name'),f.get('message'),(f.text or '')[:6000])
          PY
      - name: Require current comparison and validate installable release
        run: python3 scripts/validate_release.py
      - name: Publish verified binary and attributable evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish verified biome-depth and ecotone correction [skip ci]'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

name: Build and validate FreshGenerator
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - name: Compile game APIs and run all contract tests
        run: |
          gradle --no-daemon --console=plain clean build
          python3 scripts/test_biome_region_metrics.py
          python3 scripts/test_cave_audit_metrics.py
          python3 scripts/test_cave_full_stage_checks.py
          python3 scripts/test_technical_update_checks.py
      - name: Verify repeatable package and unchanged generation data
        run: |
          mkdir -p build/reports/technical-update
          sha256sum build/libs/*.jar > build/reports/technical-update/reproducible.sha256
          gradle --no-daemon --console=plain jar sourcesJar --rerun-tasks
          sha256sum --check build/reports/technical-update/reproducible.sha256
          python3 scripts/validate_technical_release.py build
      - name: Keep package, tests and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-build
          retention-days: 14
          path: |
            build/libs/*.jar
            build/reports/technical-update/
            build/test-results/test/
            build/reports/*tests.json
  worlds:
    if: "!contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: '42', scope: fresh}
          - {seed: '1337', scope: fresh}
          - {seed: '-20261111', scope: fresh}
          - {seed: '42', scope: normal}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - name: Exact reference, candidate and saved-world comparison
        run: bash scripts/technical_update_audit.sh '${{ matrix.seed }}' '${{ matrix.scope }}'
      - name: Keep every observation including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-world-${{ matrix.scope }}-${{ matrix.seed }}
          retention-days: 14
          path: build/reports/technical-update/${{ matrix.scope }}-${{ matrix.seed }}/
  structures:
    if: "!contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: ['42', '1337', '-20261111']
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - name: Actual structures and supported terrain with vanilla control
        run: bash scripts/technical_structure_audit.sh '${{ matrix.seed }}'
      - name: Keep warnings, geometry and structure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-structures-${{ matrix.seed }}
          retention-days: 14
          path: build/reports/technical/
  publish:
    needs: [build, worlds, structures]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: technical-*
          path: ci-evidence
      - name: Recheck raw evidence and publish only a complete passing release
        run: python3 scripts/validate_technical_release.py publish
      - name: Commit verified binary and report without overwriting newer main
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m 'build: publish verified worldgen-preserving technical update 0.3.3 [skip ci]'
          git push origin HEAD:main

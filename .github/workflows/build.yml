name: Build generation core
on:
  push:
    paths-ignore: ['dist/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-disabled: true
      - name: Compile generator graphs and test actual Minecraft data
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain clean apiProbe build 2>&1 | tee build-validation.log
      - name: Print failed tests
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          for p in pathlib.Path('build/test-results/test').glob('TEST-*.xml'):
              r=E.parse(p).getroot()
              for c in r.findall('testcase'):
                  for f in c.findall('failure')+c.findall('error'):
                      print(p.name,c.get('name'),f.get('message'),(f.text or '')[:5000])
          PY

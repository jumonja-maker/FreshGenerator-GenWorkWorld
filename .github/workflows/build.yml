name: Build and validate FreshGenerator
on:
  push:
    paths-ignore: ['dist/**', 'research/**', 'docs/**', 'README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[inspect-worldgen]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - run: gradle --no-daemon --console=plain clean build
      - uses: actions/upload-artifact@v4
        with:
          name: forest-build
          path: |
            build/libs/
            build/test-results/test/
      - name: Print unit-test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          for p in pathlib.Path('build/test-results/test').glob('TEST-*.xml'):
            for c in E.parse(p).getroot().findall('testcase'):
              for f in c.findall('failure')+c.findall('error'): print(p.name,c.get('name'),f.get('message'))
          PY
  forests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 1337, -20261111]
        scope: [fresh]
        include:
          - seed: 42
            scope: normal
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - run: bash scripts/forest_world_audit.sh "$SEED" "$SCOPE"
        env: {SEED: '${{ matrix.seed }}', SCOPE: '${{ matrix.scope }}'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forest-${{ matrix.scope }}-${{ matrix.seed }}
          path: build/reports/forest/
  structures:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - run: bash scripts/terrain_fix_audit.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: forest-structures, path: build/reports/technical/}
  publish:
    needs: [build, forests, structures]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: forest-build, path: build/}
      - uses: actions/download-artifact@v4
        with: {pattern: 'forest-fresh-*', path: build/reports/forest/, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: forest-normal-42, path: build/reports/forest/}
      - uses: actions/download-artifact@v4
        with: {name: forest-structures, path: build/reports/technical/}
      - run: python3 scripts/validate_forest_release.py
      - name: Publish only completed evidence and binary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/
          git commit -m 'build: publish tested ecological forest placement and evidence [skip ci]'
          git push origin "HEAD:$GITHUB_REF_NAME"

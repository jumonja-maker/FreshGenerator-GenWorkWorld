name: Build reconciled hydrology source tree
on:
  push:
    branches: [audit/hydrology-evidence-resume]
    paths: [.github/workflows/hydrology-reconciled-run.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6cd5557eb7cbb909f7541ef3659cc7dd708bcd54
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8.2', cache-disabled: true}
      - name: Extract literal reviewed reconciliation recipe
        shell: python
        run: |
          import pathlib,re,subprocess,textwrap
          text=subprocess.check_output(['git','show','4d6cba2751b425cfc1675760b569fbce9a93f954:.github/workflows/hydrology-reconciled-verify.yml'],text=True)
          for name,output in [('Reconcile two independently inspected source trees','/tmp/reconcile.py'),('Preserve only verified source objects for leased integration','/tmp/preserve.py')]:
              block=text.split('      - name: '+name+'\n',1)[1].split('\n      - ',1)[0]
              code=textwrap.dedent(block.split('        run: |\n',1)[1])
              pathlib.Path(output).write_text(code)
          subprocess.run(['python3','/tmp/reconcile.py'],check=True)
      - name: Compile and validate real Java25 APIs
        run: |
          set -euo pipefail
          mkdir -p "$GRADLE_USER_HOME/init.d"
          cp scripts/central-fallback.init.gradle "$GRADLE_USER_HOME/init.d/freshgenerator-central-fallback.init.gradle"
          gradle --no-daemon --console=plain clean build hydrologyAuditJar 2>&1 | tee /tmp/reconciled-build.log
          python3 -m unittest discover -s scripts -p 'test_*.py' 2>&1 | tee /tmp/reconciled-python.log
          python3 scripts/validate_hydrology_patch.py
      - name: Preserve verified source objects without changing refs
        run: python3 /tmp/preserve.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciled-hydrology-compiled-evidence
          path: |
            /tmp/reconciled-build.log
            /tmp/reconciled-python.log
            /tmp/reconciled-manifest.json
            build/test-results/test/
            build/reports/village-release/
          retention-days: 7
          if-no-files-found: error

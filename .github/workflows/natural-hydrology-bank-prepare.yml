name: Prepare verified morphology bank and surface fix
on:
  push:
    branches: [audit/natural-hydrology-transfer]
    paths: [.github/workflows/natural-hydrology-bank-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Apply exact reviewed sources without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          parent='306eb43e5af8b1ee2d73ffe383c3ebf448cd6cf3'
          cap='0eb0522898fc805c96e07566a76134411334b581'
          assert os.environ['GITHUB_REPOSITORY']=='jumonja-maker/FreshGenerator-GenWorkWorld'
          subprocess.run(['git','checkout','--detach',parent],check=True)
          patch=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(patch).hexdigest()=='c9dd7cce31bcefb677fb57682f0fbae5cc0d504092d1eaae507a9ced4d5b7c0d'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for path in ['src/tool/java/dev/freshgenerator/pack/HydrologyCompiler.java','src/test/java/dev/freshgenerator/HydrologyCompilerTest.java','scripts/validate_hydrology_patch.py']:
              Path(path).write_bytes(subprocess.check_output(['git','show',cap+':'+path]))
          p=Path('scripts/validate_hydrology_patch.py'); text=p.read_text()
          old='"core/DrainageModel$TileFactory", "core/DrainageBasin",'
          assert text.count(old)==1
          p.write_text(text.replace(old,'"core/DrainageModel$TileFactory", "core/DrainageModel$Direction", "core/DrainageModel$Curve", "core/DrainageBasin",'))
          expected={
            'scripts/test_hydrology_bank_evidence.py':'a5125575c7e08a749ccc91962ea77be698197bf0034e9c13b59a75423524e530',
            'scripts/validate_hydrology_patch.py':'26a404210301e337c167f73167293befb8dc69a5575cae0e1b318ca40ae4fb5e',
            'src/audit/java/dev/freshgenerator/audit/HydrologyWorldAudit.java':'5cb26d84a3352d3ea67dff00a743bf5997d4a78e27a579f207d585c94c431aaf',
            'src/test/java/dev/freshgenerator/HydrologyCompilerTest.java':'947128f7e0f0d93fa38b5c619b647ab5092eb5d535b431c330bfb42b1ace848d',
            'src/test/java/dev/freshgenerator/audit/HydrologyBareGroundTest.java':'cee864e03ae7799a64e38405952c006f9b7c995d66c4d5b0f7fb708d554eed4a',
            'src/tool/java/dev/freshgenerator/pack/HydrologyCompiler.java':'bbdd9271bbceb259c66de8bf1fe4d95882c1082d198abfe6e730f87ec06dd43c'}
          for path,sha in expected.items(): assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,path
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['python3','scripts/test_hydrology_bank_evidence.py'],check=True)
          def post(endpoint,body):
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+endpoint,
                  data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=60) as response:return json.load(response)
          entries=[]
          for path in expected:
              blob=post('/git/blobs',{'content':Path(path).read_text(),'encoding':'utf-8'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=post('/git/trees',{'base_tree':'1e892d14d7a552af239bf2dec71cdeb4aa18562f','tree':entries})
          commit=post('/git/commits',{'message':'fix: keep excavated lakes open and measure bank soil beneath native plants\n\nIntegrate the verified positive-alpine-relief excavation cap from 0eb052 into the morphology candidate, retaining Direction/Curve scope checks. Diagnose both failed reverse-order scenarios from immutable run 43421075905: bamboo at seed 1337 and pumpkins at seed 801086821803359396 were misclassified as bare terrain. Read the actual soil below, preserve plant coordinates/states in bankPlantStates, retain unknown solids and unchanged strict water/bed/bank signatures.\n\n284 local real-API Java tests pass. Six native Minecraft 26.3/Fabric runs on the two affected seeds agree in forward/reverse/parallel order: 3858/3858 modeled source-or-ice columns across 11 windows. Three mutation tests retain rejection of genuine bank/water/support changes. Local javac packaging is not a reproducible release; full CI and landscape visual acceptance remain required.', 'tree':tree['sha'],'parents':[parent]})
          print('FRESHGENERATOR_PREPARED_MORPHOLOGY_COMMIT',commit['sha'])
          print('VERIFIED_FILE_SHA256',json.dumps(expected,sort_keys=True))

name: Prepare exact native street provenance audit
on:
  push:
    branches: [fix/lake-river-generation-v2]
    paths: [.github/workflows/hydrology-prepare-road-audit.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[prepare-road-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 2}
      - name: Verify all input and output hashes and prepare the audited commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,re,subprocess,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/fix/lake-river-generation-v2'
          assert os.environ['GITHUB_REPOSITORY']=='jumonja-maker/FreshGenerator-GenWorkWorld'
          def git(*args):return subprocess.check_output(['git',*args]).decode().strip()
          assert git('rev-parse','HEAD^')=='1a9b2e2998f569c105c0a0b36cbd88ce259f2c8f'
          encoded=''
          encoded=encoded.replace('N47Hu91MAZB1zb7/ZGo3pQf+g2+k23m3mNN8118sdfVu93ri53','N47Hu91MAZB1zb7/ZGo3pQf+g2+k0mz3mNNvtXssZdVu91ri53')
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='969f88dbc58fb12d1d7cb918762552a7cd947814858455b70f8d6e0f149b5308'
          Path('/tmp/road-audit.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/road-audit.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/road-audit.patch'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          expected={'src/audit/java/dev/freshgenerator/audit/VillageWorldAudit.java':'0695f833012495b450fd5d1b0e100de350de6061','scripts/hydrology_village_checks.py':'75e4487a2fc3ad7c4895fa102dca382109623fa9','scripts/test_hydrology_acceptance.py':'43c264e073fd8968d328d957be1ee8cfc9ce28c3'}
          assert set(git('diff','--cached','--name-only').splitlines())==set(expected)
          subprocess.run(['python3','scripts/test_hydrology_acceptance.py'],check=True)
          def post(endpoint,body):
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+endpoint,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as res:return json.load(res)
          entries=[]
          for path,digest in expected.items():
              assert git('rev-parse',':'+path)==digest
              data=Path(path).read_bytes();assert hashlib.sha1(('blob '+str(len(data))+'\0').encode()+data).hexdigest()==digest
              blob=post('/git/blobs',{'content':data.decode(),'encoding':'utf-8'});assert blob['sha']==digest
              entries.append({'path':path,'mode':'100644','type':'blob','sha':digest})
          entries.append({'path':'.github/workflows/hydrology-prepare-road-audit.yml','mode':'100644','type':'blob','sha':None})
          tree=post('/git/trees',{'base_tree':git('rev-parse','HEAD^{tree}'),'tree':entries})
          commit=post('/git/commits',{'message':'test: identify native roads by source template blocks and measured walkability\n\nDo not classify house roof planks inside a street bounding box as roads. Observe the exact rotated native DIRT_PATH stencil, its checksum, and safe headroom/footing for native decks and grass/gravel patches. Require identical stencils in paired worlds and retain missing-road, deep-block, farmland, door and reload gates.\n\nRead-only native tracing confirmed the street processor leaves grass at both disputed coordinates and DiskFeature replaces one with gravel. Focused servers confirm the negative-seed roof is not a source path and both random-seed surfaces are walkable native paths. 164 Python tests pass including four new adversarial acceptance tests. No production game code changes in this commit. Full five-seed CI remains mandatory.', 'tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          print('FRESHGENERATOR_PREPARED_ROAD_COMMIT '+commit['sha'])
          print(json.dumps(expected,indent=2))

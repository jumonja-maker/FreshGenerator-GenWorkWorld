plugins { id 'net.fabricmc.fabric-loom' version '1.19.4' }
group = project.group
version = project.version
base { archivesName = 'FreshGenerator-Fabric-26.3' }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets {
    core { java.setSrcDirs(['src/core/java']) }
    tool {
        java.setSrcDirs(['src/tool/java'])
        compileClasspath += sourceSets.core.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.core.output + configurations.runtimeClasspath
    }
    main {
        compileClasspath += sourceSets.core.output
        runtimeClasspath += sourceSets.core.output
    }
    audit {
        java.setSrcDirs(['src/audit/java'])
        compileClasspath += sourceSets.main.output + sourceSets.core.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.core.output + configurations.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.core.output + sourceSets.tool.output + sourceSets.audit.output
        runtimeClasspath += sourceSets.core.output + sourceSets.tool.output + sourceSets.audit.output
    }
    smoke {
        java.setSrcDirs(['src/smoke/java'])
        compileClasspath += sourceSets.main.output + sourceSets.core.output + configurations.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.core.output + configurations.runtimeClasspath
    }
}
def generatedPack = layout.buildDirectory.dir('generated/worldgen')
tasks.register('generateWorldgen', JavaExec) {
    dependsOn coreClasses, toolClasses
    classpath = sourceSets.tool.runtimeClasspath
    mainClass = 'dev.freshgenerator.pack.GeneratePack'
    args generatedPack.get().asFile.absolutePath
    inputs.files(sourceSets.core.output, sourceSets.tool.output)
    inputs.property 'minecraft', project.minecraft_version
    outputs.dir generatedPack
    doFirst { delete generatedPack }
}
sourceSets.main.resources.srcDir generatedPack
processResources {
    dependsOn generateWorldgen
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
jar { from sourceSets.core.output }
sourcesJar {
    dependsOn generateWorldgen
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.core.allSource
    from sourceSets.tool.allSource
}
test {
    dependsOn toolClasses, auditClasses
    useJUnitPlatform()
    testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'full' }
}
check { dependsOn smokeClasses, auditClasses }
tasks.register('apiProbe', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.freshgenerator.ApiProbe'
}
loom {
    mods {
        freshgenerator { sourceSet sourceSets.main; sourceSet sourceSets.core }
        freshgenerator_smoke { sourceSet sourceSets.smoke }
        freshgenerator_audit { sourceSet sourceSets.audit }
    }
}
if (System.getenv('FRESHGENERATOR_SMOKE') == 'true') {
    loom.runs.named('server') {
        source = sourceSets.smoke
        vmArg '-Xmx3G'
        vmArg '-Dfreshgenerator.integration=true'
    }
    tasks.matching { it.name == 'runServer' }.configureEach { dependsOn smokeClasses }
}
if (System.getenv('FRESHGENERATOR_AUDIT') == 'true') {
    loom.runs.named('server') {
        source = sourceSets.audit
        if (System.getenv('FG_AUDIT_RUN_DIR')) runDir System.getenv('FG_AUDIT_RUN_DIR')
        vmArg '-Xmx3G'
        vmArg '-Dfreshgenerator.audit=true'
    }
    tasks.matching { it.name == 'runServer' }.configureEach { dependsOn auditClasses }
}

// The same test observer runs against published and candidate JARs in clean servers.
tasks.register('hydrologyAuditJar', Jar) {
    dependsOn auditClasses
    archiveFileName = 'hydrology-audit.jar'
    destinationDirectory = layout.buildDirectory.dir('hydrology-audit')
    from(sourceSets.audit.output) {
        include 'dev/freshgenerator/audit/HydrologyWorldAudit*.class'
        include 'dev/freshgenerator/audit/HydrologyAuditProfiles*.class'
        include 'dev/freshgenerator/audit/HydrologySettlingAudit.class'
        include 'dev/freshgenerator/audit/DistantHorizonsAudit.class'
    }
    from 'src/audit/hydrology'
}
